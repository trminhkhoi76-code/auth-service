name: Policy approval order
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: policy-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          POLICY_APPROVERS: ${{ vars.POLICY_APPROVERS }}
          POLICY_PR_APPROVERS: ${{ vars.POLICY_PR_APPROVERS }}
        with:
          script: |
            await require('./.github/policy-gate/run.cjs')({github, context, core});
