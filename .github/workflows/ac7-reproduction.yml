name: "VERIFY ONLY - AC7 OIDC simulation"

# Explicit opt-in only. GitHub's OIDC claim is real; AWS trust and IAM writes are simulated.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-tests:
    name: "SIMULATION - AC7 model tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check AC7 model
        run: python3 -m unittest discover -s verification/ac7 -v

  oidc-probe:
    name: "SIMULATION - OIDC claim probe (no AWS)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Read issued OIDC claims and simulate trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verification/ac7/reproduce.py
      - name: Upload simulation evidence (never JWT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulated-ac7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ac7-evidence/
          if-no-files-found: warn
