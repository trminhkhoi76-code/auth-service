name: "VERIFY ONLY - Policy gate simulation"

# This workflow does not authorize, assume or write an AWS IAM role.
# It deliberately does NOT run on PRs, pushes or merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: "SIMULATION - Validate policy fixture"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate a deliberately narrow demo fixture
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path("verification/policy-gate/demo-observe.json")
          raw = path.read_bytes()
          policy = json.loads(raw)
          expected = {
              "Version": "2012-10-17",
              "Statement": [{
                  "Sid": "ObserveDemo",
                  "Effect": "Allow",
                  "Action": ["sts:GetCallerIdentity"],
                  "Resource": "*",
              }],
          }
          if policy != expected:
              raise SystemExit("Invalid demonstration fixture")
          digest = hashlib.sha256(raw).hexdigest()
          print(f"SIMULATION ONLY. Fixture sha256={digest}. No AWS API call.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Verification only — policy gate demo\n\n")
              out.write(f"Fixture SHA-256: \`{digest}\`\n\n")
              out.write("No AWS credentials, IAM calls, or apply operation.\n")
          PY
