# Local stack. MySQL only:  docker compose -f docker/docker-compose.yaml up -d mysql
#                           then run the app with the "local" profile.
# Full stack:               docker compose -f docker/docker-compose.yaml up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeit}
      MYSQL_DATABASE: ${DB_NAME:-auth_service}
    ports:
      - "3307:3306"
    volumes:
      - auth_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-changeit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-auth_service}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeit}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-not-for-production-use-0123456789}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  auth_service_mysql_data:
